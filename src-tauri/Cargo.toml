[package]
name = "gdd-studio"
version = "0.1.0"
description = "GDD Studio — local-first game design documentation desktop app"
authors = ["GDD Studio"]
edition = "2021"

[lib]
name = "gdd_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
