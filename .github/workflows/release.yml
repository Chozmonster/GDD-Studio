name: Release

# Tag a commit on main (e.g. v0.1.1) to draft a GitHub Release with
# signed updater artifacts (latest.json) plus the portable Windows zip.
# Release body = that version’s section from CHANGELOG.md (Keep a Changelog).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-windows:
    name: Windows (signed + portable)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract CHANGELOG section for tag
        id: changelog
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          FILE=CHANGELOG.md
          if [ ! -f "$FILE" ]; then
            echo "CHANGELOG.md missing" >&2
            exit 1
          fi
          # Prefer ## [X.Y.Z], fall back to ## X.Y.Z
          START=$(grep -n -E "^## \[${VERSION}\]|^## ${VERSION}( |$)" "$FILE" | head -1 | cut -d: -f1 || true)
          if [ -z "${START}" ]; then
            echo "No CHANGELOG section for ${VERSION}" >&2
            exit 1
          fi
          NEXT=$(tail -n +$((START + 1)) "$FILE" | grep -n -E '^## ' | head -1 | cut -d: -f1 || true)
          if [ -n "${NEXT}" ]; then
            END=$((START + NEXT - 1))
          else
            END=$(wc -l < "$FILE")
          fi
          BODY=$(sed -n "${START},${END}p" "$FILE" | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}')
          {
            echo "body<<EOF_CHANGELOG"
            printf '%s\n' "$BODY"
            echo "EOF_CHANGELOG"
          } >> "$GITHUB_OUTPUT"
          echo "Extracted CHANGELOG lines ${START}-${END} for ${VERSION}"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build and upload signed release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Empty / unset is fine — this keypair was generated without a password.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: GDD Studio ${{ github.ref_name }}
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Package portable zip
        run: npm run package:portable

      - name: Upload portable zip to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          zips=(src-tauri/target/release/bundle/portable/*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "No portable zip found under bundle/portable/" >&2
            exit 1
          fi
          gh release upload "${{ github.ref_name }}" "${zips[@]}" --clobber
